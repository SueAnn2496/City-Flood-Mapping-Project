<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        /* Legend styling */
        .legend {
            background: white;
            padding: 10px 12px;
            font: 13px/1.5 Arial, Helvetica, sans-serif;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            color: #333;
        }
        .legend i {
            width: 14px;
            height: 14px;
            float: left;
            margin-right: 8px;
            opacity: 0.85;
            border-radius: 50%;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map"></div>

        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="data/DAERAH_SELANGOR_3375fix_1.js"></script>
        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;
            highlightLayer.openPopup();
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[2.5735227076673266,100.83561506820168],[3.5107620380641693,102.4239884247536]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }

        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() { popup.update(); }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {}

        map.createPane('pane_GoogleHybrid_0');
        map.getPane('pane_GoogleHybrid_0').style.zIndex = 400;
        var layer_GoogleHybrid_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleHybrid_0',
            opacity: 1.0,
            attribution: '<a href="https://www.google.at/permissions/geoguidelines/attr-guide.html">Map data ©2015 Google</a>',
            minZoom: 1, maxZoom: 28, minNativeZoom: 0, maxNativeZoom: 20
        });
        map.addLayer(layer_GoogleHybrid_0);

        function pop_DAERAH_SELANGOR_3375fix_1(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){ feature.closePopup() });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2"><strong>DISTRICT</strong><br />' + (feature.properties['DISTRICT'] !== null ? autolinker.link(String(feature.properties['DISTRICT']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['NEGERI'] !== null ? autolinker.link(String(feature.properties['NEGERI']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function(e) { addClassToPopupIfMedia(content, e.popup); });
            layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_DAERAH_SELANGOR_3375fix_1_0(feature) {
            switch(String(feature.properties['DISTRICT'])) {
                case 'KLANG':
                    return { pane: 'pane_DAERAH_SELANGOR_3375fix_1', opacity: 1, color: 'rgba(35,35,35,1.0)', weight: 1.5, fill: true, fillOpacity: 0.5, fillColor: 'rgba(230,255,171,1.0)', interactive: true };
                case 'PETALING JAYA':
                    return { pane: 'pane_DAERAH_SELANGOR_3375fix_1', opacity: 1, color: 'rgba(35,35,35,1.0)', weight: 1.5, fill: true, fillOpacity: 0.5, fillColor: 'rgba(113,235,199,1.0)', interactive: true };
                case 'SHAH ALAM':
                    return { pane: 'pane_DAERAH_SELANGOR_3375fix_1', opacity: 1, color: 'rgba(35,35,35,1.0)', weight: 1.5, fill: true, fillOpacity: 0.5, fillColor: 'rgba(235,168,255,1.0)', interactive: true };
            }
        }

        map.createPane('pane_DAERAH_SELANGOR_3375fix_1');
        map.getPane('pane_DAERAH_SELANGOR_3375fix_1').style.zIndex = 401;
        map.getPane('pane_DAERAH_SELANGOR_3375fix_1').style['mix-blend-mode'] = 'normal';
        
        var layer_DAERAH_SELANGOR_3375fix_1 = new L.geoJson(json_DAERAH_SELANGOR_3375fix_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_DAERAH_SELANGOR_3375fix_1',
            layerName: 'layer_DAERAH_SELANGOR_3375fix_1',
            pane: 'pane_DAERAH_SELANGOR_3375fix_1',
            onEachFeature: pop_DAERAH_SELANGOR_3375fix_1,
            style: style_DAERAH_SELANGOR_3375fix_1_0,
        });
        bounds_group.addLayer(layer_DAERAH_SELANGOR_3375fix_1);
        map.addLayer(layer_DAERAH_SELANGOR_3375fix_1);
        setBounds();

        var i = 0;
        layer_DAERAH_SELANGOR_3375fix_1.eachLayer(function(layer) {
            var context = { feature: layer.feature, variables: {} };
            layer.bindTooltip((layer.feature.properties['DISTRICT'] !== null?String('<div style="color: #323232; font-size: 10pt; font-family: \'Arial\', sans-serif;">' + layer.feature.properties['DISTRICT']) + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_DAERAH_SELANGOR_3375fix_1'});
            labels.push(layer);
            totalMarkers += 1;
            layer.added = true;
            addLabel(layer, i);
            i++;
        });
        resetLabels([layer_DAERAH_SELANGOR_3375fix_1]);
        map.on("zoomend", function(){ resetLabels([layer_DAERAH_SELANGOR_3375fix_1]); });
        map.on("layeradd", function(){ resetLabels([layer_DAERAH_SELANGOR_3375fix_1]); });
        map.on("layerremove", function(){ resetLabels([layer_DAERAH_SELANGOR_3375fix_1]); });

        // ==========================================
        // RISK POINTS 风险点数据层（高风险为红色圆圈）
        // ==========================================
        var riskPoints = [
            { name: "Seksyen 17", district: "Shah Alam", lat: 3.0512, lng: 101.5098, easting: "778973.96", northing: "337577.87", zone: "47N", risk: "Moderate Risk" },
            { name: "Seksyen 24", district: "Shah Alam", lat: 3.045, lng: 101.5163, easting: "779698.52", northing: "336893.59", zone: "47N", risk: "Low Risk" },
            { name: "Seksyen 25", district: "Shah Alam", lat: 3.0333, lng: 101.515, easting: "779556.95", northing: "335598.76", zone: "47N", risk: "Moderate Risk" },
            { name: "Padang Jawa", district: "Shah Alam", lat: 3.0526, lng: 101.4922, easting: "777016.05", northing: "337728.21", zone: "47N", risk: "Low Risk" },
            { name: "Taman Sri Muda / Seksyen 32", district: "Shah Alam", lat: 3.0232, lng: 101.5273, easting: "780927.65", northing: "334484.48", zone: "47N", risk: "High Risk" },
            { name: "Section 13", district: "Shah Alam", lat: 3.0805, lng: 101.5478, easting: "783192.86", northing: "340829.63", zone: "47N", risk: "Low Risk" },
            { name: "Seksyen 18", district: "Shah Alam", lat: 3.0528, lng: 101.5204, easting: "780152.53", northing: "337757.65", zone: "47N", risk: "Moderate Risk" },
            { name: "Seksyen 36", district: "Shah Alam", lat: 3.0189, lng: 101.5072, easting: "778693.06", northing: "334003.55", zone: "47N", risk: "Low Risk" },
            { name: "Klang River (Shah Alam stretch)", district: "Shah Alam", lat: 3.043, lng: 101.528, easting: "781000.4", northing: "336675.35", zone: "47N", risk: "Moderate Risk" },
            { name: "Jalan Kuching", district: "Petaling Jaya", lat: 3.175, lng: 101.6853, easting: "798460.41", northing: "351324.09", zone: "47N", risk: "Low Risk" },
            { name: "Jalan Segambut / Segambut shophouses", district: "Petaling Jaya", lat: 3.1818, lng: 101.6738, easting: "797179.35", northing: "352073.22", zone: "47N", risk: "Low Risk" },
            { name: "Jalan Travers", district: "Petaling Jaya", lat: 3.1328, lng: 101.6865, easting: "798605.93", northing: "346654.79", zone: "47N", risk: "Low Risk" },
            { name: "Jalan Awan Kecil (Taman OUG)", district: "Petaling Jaya", lat: 3.0768, lng: 101.6702, easting: "796808.52", northing: "340453.55", zone: "47N", risk: "Low Risk" },
            { name: "Jalan Kuchai Lama / Kuchai Link", district: "Petaling Jaya", lat: 3.0886, lng: 101.6881, easting: "798796.37", northing: "341764.29", zone: "47N", risk: "High Risk" },
            { name: "Meru", district: "Klang", lat: 3.1388, lng: 101.4402, easting: "771210.6", northing: "347251.57", zone: "47N", risk: "High Risk" },
            { name: "Taman Sentosa", district: "Klang", lat: 3.0185, lng: 101.4682, easting: "774355.32", northing: "333949.37", zone: "47N", risk: "High Risk" }
        ];

        riskPoints.forEach(function(p) {
            var color = (p.risk === "High Risk") ? "#e74c3c" : (p.risk === "Moderate Risk" ? "#f39c12" : "#2ecc71");
            
            L.circleMarker([p.lat, p.lng], {
                radius: 8,
                fillColor: color,
                color: "#000",
                weight: 1,
                opacity: 1,
                fillOpacity: 0.85
            }).addTo(map).bindPopup(
                '<div style="font-family: Arial; font-size: 13px;">' +
                '<b style="color: #2c3e50; font-size: 14px;">' + p.name + '</b><hr style="margin: 4px 0;">' +
                '<b>District:</b> ' + p.district + '<br>' +
                '<b>Risk Status:</b> <span style="color: ' + color + '; font-weight: bold;">' + p.risk + '</span><br>' +
                '<b>Latitude / Longitude:</b> ' + p.lat + ', ' + p.lng + '<br>' +
                '<b>UTM Coords:</b> ' + p.easting + ' E, ' + p.northing + ' N (' + p.zone + ')' +
                '</div>'
            );
        });

        // Add Legend Control
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML = '<b>Risk Legend</b><br>' +
                '<i style="background: #e74c3c;"></i> High Risk<br>' +
                '<i style="background: #f39c12;"></i> Moderate Risk<br>' +
                '<i style="background: #2ecc71;"></i> Low Risk';
            return div;
        };
        legend.addTo(map);
        </script>
    </body>
</html>
