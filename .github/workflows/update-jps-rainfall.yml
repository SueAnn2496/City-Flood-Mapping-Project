name: Update JPS Rainfall
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: jps-rainfall-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.12.3
      - name: Fetch official station readings
        id: fetch
        continue-on-error: true
        run: python scripts/update_jps.py
      - name: Save data or explicit source error
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/jps-selangor.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update JPS rainfall snapshot'
            git push
          fi
      - name: Report source failure
        if: steps.fetch.outcome == 'failure'
        run: exit 1
      # Commit-generated Pages builds may be skipped for GITHUB_TOKEN commits.
      # Deploy the static repository explicitly after each update.
  deploy:
    needs: update
    if: always() && needs.update.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
