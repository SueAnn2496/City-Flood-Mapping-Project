<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Map 7 - Risk Map & Live Rainfall Monitor</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100%; width: 100%; }
        .legend {
            background: white;
            padding: 10px 12px;
            font: 13px/1.5 Arial, Helvetica, sans-serif;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            color: #333;
        }
        .legend i {
            width: 14px;
            height: 14px;
            float: left;
            margin-right: 8px;
            opacity: 0.85;
            border-radius: 50%;
        }
        /* Live panel on top right */
        .live-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 15px;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            font-family: Arial, sans-serif;
            font-size: 12px;
            width: min(340px, calc(100vw - 54px));
            max-height: 65vh; overflow-y: auto;
        }
        .live-panel.collapsed { width: auto; max-width: calc(100vw - 54px); }
        .live-panel.collapsed #panelBody { display: none; }
        .live-panel.collapsed h4 { margin: 0; }
        .panel-button { border: 1px solid #d1d5db; background: #fff; border-radius: 5px; padding: 5px 8px; cursor: pointer; }
        .live-panel h4 { gap: 8px; }
        #warningBadge { font-size: 11px; color: #991b1b; white-space: nowrap; }
        .station-heavy { border-left: 3px solid #d9534f; padding-left: 7px; }
        .warning-note { color: #b91c1c; font-size: 11px; }
        .live-panel h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .live-dot {
            height: 8px;
            width: 8px;
            background-color: #9ca3af;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 rgba(46, 204, 113, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }
        .station-item {
            margin-bottom: 6px;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
        }
        .station-item:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
        .feed-status { margin: 0 0 8px; padding: 6px 8px; border-radius: 4px; background: #f3f4f6; color: #374151; }
        .feed-status.ok { background: #ecfdf5; color: #065f46; }
        .feed-status.error { background: #fef2f2; color: #991b1b; }
        .feed-status.warn { background: #fffbeb; color: #92400e; }
        .station-meta { color: #6b7280; font-size: 11px; }
        /* Custom Exclamation Icon Marker for Live JPS Warnings */
        .live-warning-marker {
            background: #d9534f;
            border: 2px solid #fff;
            border-radius: 50%;
            color: white;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            line-height: 30px;
            box-shadow: 0 0 12px rgba(217, 83, 79, 0.9);
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Live Panel UI Container -->
    <div class="live-panel collapsed" id="livePanel">
        <h4>
            <span>Live Rainfall</span>
            <span class="live-dot" id="liveIndicator"></span>
            <span id="warningBadge" aria-live="polite"></span>
            <button id="togglePanel" class="panel-button" aria-expanded="false" aria-controls="panelBody" type="button">Show ▾</button>
        </h4>
        <div id="panelBody">
            <button id="refreshFeed" class="panel-button" type="button">Refresh</button>
            <a href="https://publicinfobanjir.water.gov.my/hujan/data-hujan/?state=SEL&amp;lang=en" target="_blank" rel="noopener">Official JPS</a>
            <div id="feedStatus" class="feed-status">Loading JPS snapshot…</div>
            <div id="stationList">Loading station readings…</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([3.1, 101.55], 11);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        var points = [
            { name: "Seksyen 17", district: "Shah Alam", lat: 3.0512, lng: 101.5098, easting: "778973.96", northing: "337577.87", zone: "47N", risk: "Moderate Risk" },
            { name: "Seksyen 24", district: "Shah Alam", lat: 3.045, lng: 101.5163, easting: "779698.52", northing: "336893.59", zone: "47N", risk: "Low Risk" },
            { name: "Seksyen 25", district: "Shah Alam", lat: 3.0333, lng: 101.515, easting: "779556.95", northing: "335598.76", zone: "47N", risk: "Moderate Risk" },
            { name: "Padang Jawa", district: "Shah Alam", lat: 3.0526, lng: 101.4922, easting: "777016.05", northing: "337728.21", zone: "47N", risk: "Low Risk" },
            { name: "Taman Sri Muda / Seksyen 32", district: "Shah Alam", lat: 3.0232, lng: 101.5273, easting: "780927.65", northing: "334484.48", zone: "47N", risk: "High Risk" },
            { name: "Section 13", district: "Shah Alam", lat: 3.0805, lng: 101.5478, easting: "783192.86", northing: "340829.63", zone: "47N", risk: "Low Risk" },
            { name: "Seksyen 18", district: "Shah Alam", lat: 3.0528, lng: 101.5204, easting: "780152.53", northing: "337757.65", zone: "47N", risk: "Moderate Risk" },
            { name: "Seksyen 36", district: "Shah Alam", lat: 3.0189, lng: 101.5072, easting: "778693.06", northing: "334003.55", zone: "47N", risk: "Low Risk" },
            { name: "Klang River (Shah Alam stretch)", district: "Shah Alam", lat: 3.043, lng: 101.528, easting: "781000.4", northing: "336675.35", zone: "47N", risk: "Moderate Risk" },
            { name: "Jalan Kuching", district: "Petaling Jaya", lat: 3.175, lng: 101.6853, easting: "798460.41", northing: "351324.09", zone: "47N", risk: "Low Risk" },
            { name: "Jalan Segambut / Segambut shophouses", district: "Petaling Jaya", lat: 3.1818, lng: 101.6738, easting: "797179.35", northing: "352073.22", zone: "47N", risk: "Low Risk" },
            { name: "Jalan Travers", district: "Petaling Jaya", lat: 3.1328, lng: 101.6865, easting: "798605.93", northing: "346654.79", zone: "47N", risk: "Low Risk" },
            { name: "Jalan Awan Kecil (Taman OUG)", district: "Petaling Jaya", lat: 3.0768, lng: 101.6702, easting: "796808.52", northing: "340453.55", zone: "47N", risk: "Low Risk" },
            { name: "Jalan Kuchai Lama / Kuchai Link", district: "Petaling Jaya", lat: 3.0886, lng: 101.6881, easting: "798796.37", northing: "341764.29", zone: "47N", risk: "High Risk" },
            { name: "KL–Seremban Expressway tunnel (toward Sri Petaling)", district: "Petaling Jaya", lat: 3.0689, lng: 101.6963, easting: "799714.03", northing: "339586.68", zone: "47N", risk: "Low Risk" },
            { name: "New Pantai Expressway (NPE - toward Old Klang Road)", district: "Petaling Jaya", lat: 3.085, lng: 101.6789, easting: "797774.0", northing: "341363.35", zone: "47N", risk: "Low Risk" },
            { name: "Federal Highway (PJ segment)", district: "Petaling Jaya", lat: 3.1026, lng: 101.6447, easting: "793964.91", northing: "343301.29", zone: "47N", risk: "Low Risk" },
            { name: "MRR2 (Desa Tun Razak segment)", district: "Petaling Jaya", lat: 3.0831, lng: 101.7145, easting: "801734.61", northing: "341163.14", zone: "47N", risk: "Low Risk" },
            { name: "KL–Seremban Expressway (toward Desa Petaling)", district: "Petaling Jaya", lat: 3.0862, lng: 101.7052, easting: "800699.21", northing: "341503.54", zone: "47N", risk: "Low Risk" },
            { name: "223 Food Court / Medan Selera 223 (Section 51A / Jalan 51A/223)", district: "Petaling Jaya", lat: 3.1021, lng: 101.6322, easting: "792574.66", northing: "343242.5", zone: "47N", risk: "Low Risk" },
            { name: "Amway Malaysia HQ (Section 51A)", district: "Petaling Jaya", lat: 3.1015, lng: 101.6318, easting: "792530.33", northing: "343176.0", zone: "47N", risk: "Low Risk" },
            { name: "Meru", district: "Klang", lat: 3.1388, lng: 101.4402, easting: "771210.6", northing: "347251.57", zone: "47N", risk: "High Risk" },
            { name: "Taman Melawis", district: "Klang", lat: 3.0375, lng: 101.4372, easting: "770902.67", northing: "336043.62", zone: "47N", risk: "Moderate Risk" },
            { name: "Subang Jaya (RTB Flood Mitigation Project)", district: "Subang Jaya", lat: 3.0567, lng: 101.5851, easting: "787347.98", northing: "338206.25", zone: "47N", risk: "Low Risk" },
            { name: "Batu Dam", district: "Upstream / Regional Infrastructure", lat: 3.2681, lng: 101.6871, easting: "798633.44", northing: "361626.61", zone: "47N", risk: "Low Risk" },
            { name: "Klang Gates Dam", district: "Upstream / Regional Infrastructure", lat: 3.2312, lng: 101.7512, easting: "805773.8", northing: "357562.52", zone: "47N", risk: "Low Risk" },
            { name: "Kampung Laksamana Retention Pond", district: "Upstream / Regional Infrastructure", lat: 3.2435, lng: 101.6782, easting: "797650.84", northing: "358901.87", zone: "47N", risk: "Low Risk" },
            { name: "Sungai Kertas Retention Pond", district: "Upstream / Regional Infrastructure", lat: 3.2562, lng: 101.6981, easting: "799860.37", northing: "360313.08", zone: "47N", risk: "Low Risk" },
            { name: "Bukit Lagong Retention Pond", district: "Upstream / Regional Infrastructure", lat: 3.252, lng: 101.6215, easting: "791342.41", northing: "359825.87", zone: "47N", risk: "Low Risk" },
            { name: "Seksyen 22", district: "Shah Alam", lat: 3.0722, lng: 101.5542, easting: "783906.9", northing: "339913.0", zone: "47N", risk: "Moderate Risk" },
            { name: "I-City", district: "Shah Alam", lat: 3.0658, lng: 101.4831, easting: "776000.54", northing: "339186.28", zone: "47N", risk: "Low Risk" },
            { name: "Bukit Lanchong / Kg Bukit Lanchung", district: "Shah Alam", lat: 3.0135, lng: 101.5642, easting: "785034.61", northing: "333420.86", zone: "47N", risk: "Moderate Risk" },
            { name: "Taman Desa Kemuning", district: "Shah Alam", lat: 3.0238, lng: 101.5165, easting: "779726.23", northing: "334548.07", zone: "47N", risk: "Low Risk" },
            { name: "Seksyen 35", district: "Shah Alam", lat: 3.0185, lng: 101.5122, easting: "779249.3", northing: "333960.57", zone: "47N", risk: "Low Risk" },
            { name: "Kampung Budiman", district: "Shah Alam", lat: 3.1381, lng: 101.482, easting: "775859.43", northing: "347185.06", zone: "47N", risk: "Low Risk" },
            { name: "Seksyen U14", district: "Shah Alam", lat: 3.1285, lng: 101.488, easting: "776529.24", northing: "346124.52", zone: "47N", risk: "Low Risk" },
            { name: "Persiaran Jubli Perak", district: "Shah Alam", lat: 3.056, lng: 101.5312, easting: "781352.94", northing: "338114.52", zone: "47N", risk: "Moderate Risk" },
            { name: "Kelana Jaya", district: "Petaling Jaya", lat: 3.1043, lng: 101.5976, easting: "788725.54", northing: "343476.41", zone: "47N", risk: "Low Risk" },
            { name: "Damansara (Ara Damansara / PJ Damansara)", district: "Petaling Jaya", lat: 3.1283, lng: 101.5831, easting: "787106.24", northing: "346127.96", zone: "47N", risk: "Low Risk" },
            { name: "Jalan 222 (BH petrol station / Federal Highway junction)", district: "Petaling Jaya", lat: 3.1028, lng: 101.6295, easting: "792274.14", northing: "343319.2", zone: "47N", risk: "Low Risk" },
            { name: "Taman Sentosa", district: "Klang", lat: 3.0185, lng: 101.4682, easting: "774355.32", northing: "333949.37", zone: "47N", risk: "High Risk" },
            { name: "Bandar Botanic", district: "Klang", lat: 2.9985, lng: 101.4428, easting: "771535.19", northing: "331730.31", zone: "47N", risk: "Low Risk" },
            { name: "Bandar Puteri", district: "Klang", lat: 2.9931, lng: 101.4625, easting: "773727.68", northing: "331137.79", zone: "47N", risk: "Low Risk" },
            { name: "Taman Chi Liung", district: "Klang", lat: 3.0275, lng: 101.4362, easting: "770793.93", northing: "334937.04", zone: "47N", risk: "Low Risk" },
            { name: "Taman Sri Andalas", district: "Klang", lat: 3.0232, lng: 101.455, easting: "772885.99", northing: "334466.03", zone: "47N", risk: "Moderate Risk" },
            { name: "Teluk Pulai", district: "Klang", lat: 3.0418, lng: 101.4285, easting: "769933.98", northing: "336517.16", zone: "47N", risk: "Low Risk" },
            { name: "Pandamaran", district: "Klang", lat: 3.0125, lng: 101.4182, easting: "768795.66", northing: "333273.08", zone: "47N", risk: "Moderate Risk" },
            { name: "Jalan Kebun Nenas / Kg Jawa", district: "Klang", lat: 3.0162, lng: 101.4785, easting: "775501.52", northing: "333697.51", zone: "47N", risk: "Moderate Risk" }
        ];

        // 1. Render all base risk points normally using standard circle markers (High Risk = Red circles)
        points.forEach(function(p) {
            var color = (p.risk === "High Risk") ? "#e74c3c" : (p.risk === "Moderate Risk" ? "#f39c12" : "#2ecc71");
            
            L.circleMarker([p.lat, p.lng], {
                radius: 8,
                fillColor: color,
                color: "#000",
                weight: 1,
                opacity: 1,
                fillOpacity: 0.85
            }).addTo(map).bindPopup(
                '<div style="font-family: Arial; font-size: 13px;">' +
                '<b style="color: #2c3e50; font-size: 14px;">' + p.name + '</b><hr style="margin: 4px 0;">' +
                '<b>District:</b> ' + p.district + '<br>' +
                '<b>Project Risk:</b> <span style="color: ' + color + '; font-weight: bold;">' + p.risk + '</span><br>' +
                '<b>Latitude / Longitude:</b> ' + p.lat + ', ' + p.lng + '<br>' +
                '<b>UTM Coords:</b> ' + p.easting + ' E, ' + p.northing + ' N (' + p.zone + ')' +
                '</div>'
            );
        });

        // Add Legend Control
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML = '<b>Risk Legend</b><br>' +
                '<i style="background: #e74c3c;"></i> High Risk<br>' +
                '<i style="background: #f39c12;"></i> Moderate Risk<br>' +
                '<i style="background: #2ecc71;"></i> Low Risk<br>' +
                '<hr style="margin:4px 0;"><small><b style="color:#d9534f">!</b> Heavy rain — possible waterlogging<br>Click ! for station and observation time.</small>';
            return div;
        };
        legend.addTo(map);

        const JPS_REFRESH_MS = 60000;
        const MAX_AGE_MS = 90 * 60000;
        const feedStatus = document.getElementById('feedStatus');
        const stationList = document.getElementById('stationList');
        const indicator = document.getElementById('liveIndicator');
        const warningLayer = L.layerGroup().addTo(map);
        const warningBadge = document.getElementById('warningBadge');
        let currentSnapshot = null;
        let loading = false;
        // These are project AREA coordinates, not surveyed JPS station locations.
        // Names must match explicitly; never map every point in a district as flooded.
        const stationAreaNames = {
            'taman sri muda': 'Taman Sri Muda / Seksyen 32',
            'taman desa kemuning': 'Taman Desa Kemuning',
            'taman sentosa': 'Taman Sentosa',
            'pekan meru': 'Meru',
            'p/a pandamaran': 'Pandamaran',
            'pandamar': 'Pandamaran',
            'jalan 222': 'Jalan 222 (BH petrol station / Federal Highway junction)',
            'kg. budiman': 'Kampung Budiman',
            'bukit lancong faz': 'Bukit Lanchong / Kg Bukit Lanchung'
        };
        // For unmatched stations, use ONE district reference marker, explicitly
        // labelled as regional information, not the location of rain or flooding.
        const districtReferences = {
            'Klang': {lat:3.0449, lng:101.4456},
            'Petaling': {lat:3.12, lng:101.60}
        };
        function stationArea(station) {
            const name = station.name.toLowerCase().replace(/\s*\(f2\)\s*$/i, '').trim();
            return points.find(p => p.name === stationAreaNames[name]);
        }
        function heavyStations(data) {
            if (!data || data.ok !== true || !isFresh(data.fetchedAt)) return [];
            return data.stations.filter(s => isFresh(s.lastUpdated) &&
                typeof s.oneHourMm === 'number' && Number.isFinite(s.oneHourMm) && s.oneHourMm > 30);
        }
        function renderWarnings(data) {
            warningLayer.clearLayers();
            const heavy = heavyStations(data);
            warningBadge.textContent = heavy.length ? '! ' + heavy.length + ' stations' : '';
            const groups = new Map();
            heavy.forEach(s => {
                const area = stationArea(s);
                const ref = area || districtReferences[s.district];
                if (!ref) return;
                const key = area ? 'area:' + area.name : 'district:' + s.district;
                if (!groups.has(key)) groups.set(key, {ref, area, district:s.district, stations:[]});
                groups.get(key).stations.push(s);
            });
            groups.forEach(group => {
                const title = group.area ? group.area.name : group.district + ' district — regional rain alert';
                const placement = group.area ? 'Marker shows the project area, not the exact rain gauge.' : 'Marker is a district reference only. Heavy rain was reported at the stations below; it may be elsewhere in this district.';
                const readings = group.stations.map(s => '<b>' + escapeHtml(s.name) + '</b>: ' + s.oneHourMm.toFixed(1) +
                    ' mm / 1 hour (' + rainfallCategory(s.oneHourMm) + ')<br><small>' + escapeHtml(formatTime(s.lastUpdated)) + '</small>').join('<hr>');
                const icon = L.divIcon({className:'live-warning-marker', html:'!', iconSize:[32,32], iconAnchor:[16,16]});
                L.marker([group.ref.lat, group.ref.lng], {icon, zIndexOffset:1000})
                    .bindTooltip(title + ': possible waterlogging')
                    .bindPopup('<b>' + escapeHtml(title) + '</b><p style="color:#b91c1c">Heavy rain — possible waterlogging. Flooding has not been confirmed.</p>' +
                        readings + '<p><small>' + placement + '</small></p>').addTo(warningLayer);
            });
        }
        const panel = document.getElementById('livePanel');
        const togglePanel = document.getElementById('togglePanel');
        togglePanel.addEventListener('click', () => {
            const collapsed = panel.classList.toggle('collapsed');
            togglePanel.setAttribute('aria-expanded', String(!collapsed));
            togglePanel.textContent = collapsed ? 'Show ▾' : 'Hide ▴';
        });
        L.DomEvent.disableClickPropagation(panel);
        L.DomEvent.disableScrollPropagation(panel);
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        }
        function isFresh(value) {
            const time = Date.parse(value);
            const age = Date.now() - time;
            return Number.isFinite(time) && age >= -300000 && age <= MAX_AGE_MS;
        }
        function formatTime(value) {
            return Number.isFinite(Date.parse(value)) ? new Date(value).toLocaleString('en-MY', {timeZone:'Asia/Kuala_Lumpur'}) + ' MYT' : 'Unknown';
        }
        function rainfallCategory(mm) {
            if (typeof mm !== 'number' || !Number.isFinite(mm) || mm < 0) return 'No data';
            return mm === 0 ? 'No rainfall' : mm <= 10 ? 'Light' : mm <= 30 ? 'Moderate' : mm <= 60 ? 'Heavy' : 'Very heavy';
        }
        function setFeedStatus(message, kind) {
            feedStatus.className = 'feed-status ' + kind;
            feedStatus.textContent = message;
            indicator.style.backgroundColor = kind === 'ok' ? '#2ecc71' : kind === 'warn' ? '#f39c12' : '#9ca3af';
            indicator.style.animation = kind === 'ok' ? 'pulse 2s infinite' : 'none';
            indicator.title = message;
        }
        function renderStations(stations, snapshotFresh) {
            let freshCount = 0;
            const sorted = [...stations].sort((a,b) => a.district.localeCompare(b.district) || a.name.localeCompare(b.name));
            stationList.innerHTML = sorted.map(station => {
                const fresh = snapshotFresh && isFresh(station.lastUpdated);
                const category = fresh ? rainfallCategory(station.oneHourMm) : 'STALE — not current';
                if (fresh && category !== 'No data') freshCount++;
                const mm = typeof station.oneHourMm === 'number' && Number.isFinite(station.oneHourMm) && station.oneHourMm >= 0 ? station.oneHourMm.toFixed(1) + ' mm (1-hour total at observation time)' : 'No data';
                const heavy = fresh && typeof station.oneHourMm === 'number' && Number.isFinite(station.oneHourMm) && station.oneHourMm > 30;
                return '<div class="station-item' + (heavy ? ' station-heavy' : '') + '"><b>' + escapeHtml(station.name) + '</b><br>JPS district: ' + escapeHtml(station.district) + '<br>' +
                    (fresh ? 'Rainfall: ' : 'Last recorded rainfall: ') + escapeHtml(mm) + '<br><b>' + escapeHtml(category) + '</b><br><small class="station-meta">Station observed: ' + escapeHtml(formatTime(station.lastUpdated)) + '</small></div>';
            }).join('');
            return freshCount;
        }
        async function loadLiveRainfallData() {
            if (loading) return;
            loading = true;
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 20000);
            try {
                const response = await fetch(
    '/City-Flood-Mapping-Project/data/jps-selangor.json?ts=' + Date.now(),
    { cache: 'no-store', signal: controller.signal }
);
                if (!response.ok) throw new Error('JSON returned HTTP ' + response.status + '. Upload data/jps-selangor.json and run the workflow.');
                const data = await response.json();
                if (data.ok !== true) throw new Error(data.error || 'JPS source unavailable');
                if (data.schemaVersion !== 1 || !Array.isArray(data.stations) || !data.stations.length || !data.stations.every(s => s && typeof s.name === 'string' && typeof s.district === 'string')) throw new Error('JSON format mismatch. Use the included update_jps.py.');
                currentSnapshot = data;
                renderWarnings(data);
                const snapshotFresh = isFresh(data.fetchedAt);
                const freshCount = renderStations(data.stations, snapshotFresh);
                const allFresh = freshCount === data.stations.length;
                setFeedStatus((!snapshotFresh ? 'STALE snapshot — check GitHub Actions. ' : freshCount === 0 ? 'No current station readings. ' : 'Current readings: ' + freshCount + '/' + data.stations.length + '. ') + 'JPS fetched: ' + formatTime(data.fetchedAt) + '. Page checked: ' + formatTime(new Date().toISOString()) + '. Scheduled fetch: every 15 min; page check: every 60 sec.', snapshotFresh && allFresh ? 'ok' : 'warn');
            } catch (error) {
                currentSnapshot = null;
                warningLayer.clearLayers();
                warningBadge.textContent = 'Unavailable';
                setFeedStatus('DATA UNAVAILABLE — ' + error.message, 'error');
                stationList.textContent = 'Current rainfall cannot be confirmed. Check the official JPS page or the workflow logs.';
            } finally {
                clearTimeout(timeout);
                loading = false;
            }
        }
        document.getElementById('refreshFeed').addEventListener('click', loadLiveRainfallData);
        loadLiveRainfallData();
        setInterval(loadLiveRainfallData, JPS_REFRESH_MS);
        // Expire warning markers even while a slow network request is pending.
        setInterval(() => {
            if (currentSnapshot) {
                renderWarnings(currentSnapshot);
                renderStations(currentSnapshot.stations, isFresh(currentSnapshot.fetchedAt));
                if (!isFresh(currentSnapshot.fetchedAt)) setFeedStatus('STALE snapshot — check GitHub Actions.', 'warn');
            }
        }, 15000);
    </script>
</body>
</html>
