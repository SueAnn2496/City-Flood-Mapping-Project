<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <style>
            html, body, #map { width: 100%; height: 100%; padding: 0; margin: 0; }
        </style>
        <title>Risk Map - Street View</title>
    </head>
    <body>
        <div id="map"></div>
        
        <!-- Leaflet scripts & qgis2web generated scripts -->
        <script src="js/leaflet.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        
        <!-- Replace/Include your exported coordinate points JS file here -->
        <!-- <script src="data/risk_points_1.js"></script> -->

        <script>
        var map = L.map('map', {
            zoomControl: true, maxZoom: 28, minZoom: 1
        }).fitBounds([[2.9, 101.3], [3.3, 101.8]]); // Center default around Selangor/Klang Valley

        var hash = new L.Hash(map);
        
        // Use OpenStreetMap as the Street Map base layer
        var basemapLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });
        map.addLayer(basemapLayer);

        // NOTE: Once you run qgis2web and save it into Map7/, 
        // the exported code will automatically load your coordinate point layers here.
        </script>
    </body>
</html>
