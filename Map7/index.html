<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map 7 - Coordinate Excel Plotter</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- SheetJS (XLSX) library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        .upload-control {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: white;
            padding: 12px 15px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .upload-control label {
            font-size: 13px;
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
            color: #2c3e50;
        }
        .upload-control input[type="file"] {
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- Excel Upload Widget -->
    <div class="upload-control">
        <label for="excelUpload">📁 Upload Coordinate Excel:</label>
        <input type="file" id="excelUpload" accept=".xlsx, .xls" />
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map (Centered around Selangor / Klang Valley region)
        var map = L.map('map').setView([3.0738, 101.5183], 11);

        // Add OpenStreetMap Basemap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Layer group to store plotted points
        var markerGroup = L.layerGroup().addTo(map);

        // Handle Excel File Upload & Plotting
        document.getElementById('excelUpload').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(e) {
                var data = new Uint8Array(e.target.result);
                var workbook = XLSX.read(data, {type: 'array'});
                
                // Read the first sheet of the Excel file
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];
                
                // Convert sheet rows to JSON array
                var rows = XLSX.utils.sheet_to_json(worksheet);
                
                // Clear any previously plotted markers
                markerGroup.clearLayers();
                var count = 0;
                var bounds = [];

                rows.forEach(function(row) {
                    // Match multiple common variations of column names
                    var lat = row.Latitude || row.lat || row.LAT;
                    var lng = row.Longitude || row.lng || row.LNG || row.Lon || row.LON;
                    var name = row.Name || row.ID || row.Point || `Point ${count + 1}`;

                    if (lat !== undefined && lng !== undefined) {
                        var latNum = parseFloat(lat);
                        var lngNum = parseFloat(lng);
                        
                        if (!isNaN(latNum) && !isNaN(lngNum)) {
                            var marker = L.marker([latNum, lngNum]);
                            marker.bindPopup(`<b>${name}</b><br>Lat: ${latNum}<br>Lng: ${lngNum}`);
                            markerGroup.addLayer(marker);
                            
                            bounds.push([latNum, lngNum]);
                            count++;
                        }
                    }
                });

                if (count > 0) {
                    // Automatically adjust map view to fit all coordinate points
                    map.fitBounds(bounds, { padding: [50, 50] });
                    alert(`Successfully plotted ${count} points from Excel!`);
                } else {
                    alert('No valid coordinates found. Please ensure your Excel columns are named "Latitude" and "Longitude" (or "lat" / "lng").');
                }
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
