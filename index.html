<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web GIS Map Viewer - City Flood Mapping</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { height: 100%; font-family: Arial, sans-serif; display: flex; flex-direction: column; }
        
        /* Navigation bar styles */
        .nav-bar {
            background-color: #2c3e50;
            display: flex;
            padding: 10px 20px;
            gap: 10px;
            align-items: center;
        }
        .nav-bar h2 {
            color: #ecf0f1;
            font-size: 18px;
            margin-right: 20px;
        }
        .nav-btn {
            padding: 8px 16px;
            background-color: #34495e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        .nav-btn:hover, .nav-btn.active {
            background-color: #1abc9c;
        }

        /* Map display container */
        .map-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 50px);
            border: none;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <h2>🗺️ City Flood Mapping Platform</h2>
        <!-- Match exact folder names: Map1, Map2, Map3 -->
        <button class="nav-btn active" onclick="switchMap('Map1/', this)">Klang</button>
        <button class="nav-btn" onclick="switchMap('Map2/', this)">Shah Alam</button>
        <button class="nav-btn" onclick="switchMap('Map3/', this)">Petaling Jaya</button>
    </div>

    <!-- Default loaded map -->
    <iframe id="mapFrame" class="map-container" src="Map1/index.html"></iframe>

    <script>
        function switchMap(mapPath, btn) {
            // Switch iframe content to selected map folder
            document.getElementById('mapFrame').src = mapPath + 'index.html';
            
            // Update active button state
            var buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
        }
    </script>

</body>
</html>
