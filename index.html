<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web GIS Map Viewer - City Flood Mapping</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { height: 100%; font-family: Arial, sans-serif; overflow: hidden; }
        
        /* Layout Structure */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Toggle Button */
        .toggle-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: background 0.3s;
        }
        .toggle-btn:hover {
            background-color: #34495e;
        }

        /* Sliding Dashboard Sidebar */
        .sidebar {
            width: 280px;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 70px 20px 20px 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
            transition: margin-left 0.3s ease;
            z-index: 900;
        }
        .sidebar.collapsed {
            margin-left: -280px;
        }

        .sidebar h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #ecf0f1;
            border-bottom: 2px solid #34495e;
            padding-bottom: 10px;
        }

        /* Map Navigation Buttons */
        .map-selector {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .nav-btn {
            padding: 12px 15px;
            background-color: #34495e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-align: left;
            transition: all 0.3s;
        }
        .nav-btn:hover, .nav-btn.active {
            background-color: #1abc9c;
            font-weight: bold;
            padding-left: 20px;
        }

        /* Map Viewer Frame */
        .map-container {
            flex: 1;
            height: 100%;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Dashboard Toggle Button -->
        <button class="toggle-btn" onclick="toggleDashboard()">☰ Dashboard</button>

        /* Sliding Dashboard Sidebar */
        <div class="sidebar" id="sidebar">
            <h2>🗺️ Flood Maps</h2>
            <div class="map-selector">
                <button class="nav-btn active" onclick="switchMap('Map1/', this)">Boundary Area Map</button>
                <button class="nav-btn" onclick="switchMap('Map2/', this)">Slope Map</button>
                <button class="nav-btn" onclick="switchMap('Map3/', this)">Land Cover Map</button>
            </div>
        </div>

        <!-- Map Display Container -->
        <iframe id="mapFrame" class="map-container" src="Map1/index.html"></iframe>
    </div>

    <script>
        // Switch between map folders
        function switchMap(mapPath, btn) {
            document.getElementById('mapFrame').src = mapPath + 'index.html';
            
            var buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
        }

        // Expand or collapse Dashboard sidebar
        function toggleDashboard() {
            var sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        }
    </script>

</body>
</html>
